# Supervised fine-tuning of the base model on silver/golden references.
# Real run: one 24 GB GPU (L4 / A10G). LoRA, the GPU notebook and logging
# settings are added in Phase 2.
experiment:
  name: sft-qwen3.5-0.8b
  seed: 42

data:
  train_path: data/processed/train.jsonl
  dev_path: data/processed/dev.jsonl
  include_category: true

model:
  name_or_path: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17
  dtype: bfloat16
  # Fallback base model (see docs/decisions.md, ADR-001):
  # name_or_path: Qwen/Qwen3-1.7B
  # revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  # chat_template_kwargs: {enable_thinking: false}

training:
  output_dir: checkpoints/sft
  max_length: 1024
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 2.0e-5
  warmup_steps: 0.03  # fraction of total steps
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  report_to: [none]
