# Supervised fine-tuning configuration for the Legal Clause Simplifier project.
# These values are designed to run inside a SageMaker training job but also work
# for local experimentation. Update the S3 URIs to match your environment before
# launching a large run.

experiment:
  name: distilgpt2-sft
  seed: 42

paths:
  train_csv: data/processed/clauses_train.csv
  eval_csv: data/processed/clauses_dev.csv
  text_column: clause
  target_column: reference_simple
  category_column: category
  entity_column: entities
  cache_dir: data/raw/hf_cache
  output_dir: checkpoints/sft
  output_s3_uri: s3://legal-clause-simplifier/checkpoints/sft/
  tensorboard_s3_uri: s3://legal-clause-simplifier/logs/sft/

prompt:
  template: |-
    Simplify the following legal clause in plain English while preserving entities (dates, amounts, parties, defined terms).

    Clause: {clause}

    Simplified:
  max_source_tokens: 512
  max_target_tokens: 196

model:
  name_or_path: distilgpt2
  tokenizer_name: distilgpt2
  padding_side: left
  use_peft: false

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  max_train_steps: null
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  lr_scheduler_type: cosine
  fp16: true
  logging_steps: 50
  save_steps: 500
  eval_steps: 500
  evaluation_strategy: steps
  save_total_limit: 4
  dataloader_num_workers: 2
  max_grad_norm: 1.0

monitoring:
  use_wandb: true
  wandb_project: legal-clause-simplifier
  wandb_run_name: sft-distilgpt2
  report_to: ["tensorboard", "wandb"]

sagemaker:
  instance_type: ml.g5.2xlarge
  instance_count: 1
  volume_size_gb: 200
  max_runtime_seconds: 14400
