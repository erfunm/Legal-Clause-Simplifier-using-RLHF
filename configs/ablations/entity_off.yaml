# GRPO ablation, resolved on top of configs/grpo.yaml. Run: lcs ablate (or modal run scripts/modal_rl.py --stage ablations).
base: ../grpo.yaml
name: ablation-entity-off
description: "Entity reward computed and logged but weighted 0 in the advantage"
overrides:
  rewards.weights.entity_preservation: 0.0
  grpo.max_steps: 300           # small, equal budget for every ablation run
