name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  UV_FROZEN: "1"

jobs:
  checks:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/conftest.py', 'configs/smoke/**') }}
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test-all

  eval-gate:
    name: Eval gate (re-score frozen mock outputs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: make eval-gate

  docker:
    name: Build the CPU serving image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: make docker-build

  smoke:
    name: End-to-end smoke run (CPU, tiny model)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/conftest.py', 'configs/smoke/**') }}
      - run: make install
      - run: make smoke
