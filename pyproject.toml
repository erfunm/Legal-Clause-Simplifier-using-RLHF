[project]
name = "legal-simplifier"
version = "0.1.0"
description = "Post-training a small LLM (SFT -> GRPO/DPO) to rewrite legal clauses in plain English while preserving entities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.0",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "textstat>=0.7.4",
    "typer>=0.15",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.10",
    "datasets>=5.0",
    "peft>=0.21",
    "torch>=2.8",
    "transformers>=5.20",
    "trl>=1.16",
]
# Experiment tracking for training runs (choose one in the config's `tracking` block).
tracking = [
    "trackio>=0.44",
    "wandb>=0.31",
]
# 4-bit QLoRA. bitsandbytes needs a CUDA GPU at run time; on CPU only the config is built.
qlora = [
    "bitsandbytes>=0.50; sys_platform == 'linux'",
]
eval = [
    "bert-score>=0.3.13",
    "matplotlib>=3.10",  # lcs report figures
]
nlp = [
    "spacy>=3.8",
]
api = [
    "anthropic>=2.3",
]
review = [
    "gradio>=6.0",
]
aws = [
    "boto3>=1.35",
]

[project.scripts]
lcs = "legal_simplifier.cli:app"

[dependency-groups]
dev = [
    # Only for the SARI cross-check against Hugging Face evaluate (tests/test_sari_vs_hf.py).
    "evaluate>=0.4.6",
    "sacrebleu>=2.6",
    "sacremoses>=0.1",
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_simplifier"]

[tool.uv]
default-groups = ["dev"]

# CPU wheels keep CI and local installs small. GPU runs (Colab/Kaggle/Modal)
# install the package on top of the platform's own CUDA torch instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# transformers/trl export public names through lazy modules that pyright reads as private.
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads a tiny HF model or runs a trainer (still CPU-only)",
]
addopts = "-ra"
